services:
  orchestrator:
    build: .
    image: crowdgpt-orchestrator:local
    restart: unless-stopped
    init: true
    ports:
      - "5006:5006"
    environment:
      CROWDGPT_ADMIN_SECRET: "${CROWDGPT_ADMIN_SECRET:?set CROWDGPT_ADMIN_SECRET}"
      CROWDGPT_PUBLIC_URL: "${CROWDGPT_PUBLIC_URL:-http://localhost:5006}"
      CROWDGPT_TRUSTED_PROXIES: "${CROWDGPT_TRUSTED_PROXIES:-}"
      CROWDGPT_PEERS: "${CROWDGPT_PEERS:-[]}"
      CROWDGPT_PEER_QUORUM: "${CROWDGPT_PEER_QUORUM:-}"
      CROWDGPT_ADMISSION_POLICY: "${CROWDGPT_ADMISSION_POLICY:-open}"
      CROWDGPT_EVAL_URL: "${CROWDGPT_EVAL_URL:-}"
      CROWDGPT_LOSS_CHECK_MODE: "${CROWDGPT_LOSS_CHECK_MODE:-off}"
      CROWDGPT_HOST: "0.0.0.0"
      CROWDGPT_PORT: "5006"
    volumes:
      # A named volume inherits the image's /data ownership (UID 10001).
      # A host bind mount must be chowned to 10001:10001 first.
      - crowdgpt-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/cluster/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

volumes:
  crowdgpt-data:
